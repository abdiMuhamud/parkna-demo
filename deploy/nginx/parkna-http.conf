# ParkNa on plain HTTP, for a first bring-up by IP address before the domain and certificate exist.
# Use parkna.conf instead as soon as you can: without HTTPS, anyone on the path can read the traffic.
# Copy to /etc/nginx/conf.d/parkna.conf and remove the default server {} block from /etc/nginx/nginx.conf.
upstream parkna_tomcat {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/parkna.access.log;
    error_log  /var/log/nginx/parkna.error.log;

    include /etc/nginx/snippets/parkna-locations.conf;
}
