# ParkNa on HTTPS (the normal setup). Copy to /etc/nginx/conf.d/parkna.conf and replace parkna.example.gm.
# Certificate: certbot (Let's Encrypt), or the files supplied for the domain (SI/QA manual 2.6.2).
upstream parkna_tomcat {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name parkna.example.gm;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name parkna.example.gm;

    ssl_certificate     /etc/letsencrypt/live/parkna.example.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkna.example.gm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/parkna.access.log;
    error_log  /var/log/nginx/parkna.error.log;

    include /etc/nginx/snippets/parkna-locations.conf;
}
