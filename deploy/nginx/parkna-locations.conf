# ParkNa: what Nginx serves. Included by parkna.conf / parkna-http.conf.
# Copy to /etc/nginx/snippets/parkna-locations.conf

# Front end: the files from the release's frontend/ folder (landing page, /admin, /org, /driver/, /officer/)
root  /usr/share/nginx/html/parkna-web;          # link to parkna-web-v<version>, switched by deploy.sh
index index.html;

location / {
    try_files $uri $uri.html $uri/ =404;
}
location ~* \.(woff2|png|jpg|svg|ico)$ {
    expires 7d;
    access_log off;
}
location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-cache";
}

# Back end: Tomcat on this server. Tomcat itself is never reachable from outside (firewall + 127.0.0.1 connector).
# Incoming SMS come from Kannel straight to Tomcat, never through here.
location /api/sms/ {
    return 403;
}

# Live updates: one long request per open screen; must not be buffered or cut after 60 s
location = /api/events {
    proxy_pass http://parkna_tomcat/parkna/api/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location /api/ {
    proxy_pass http://parkna_tomcat/parkna/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
