# ParkNa in Kannel (SI/QA manual 2.1). Add these groups to /etc/kannel/kannel.conf, set the password,
# then: service kannel restart
# config.properties must then have sms.gateway=kannel and the same username/password.

# ParkNa sends its SMS with this account (sms.kannel.username / sms.kannel.password)
group = sendsms-user
username = parkna
password = CHANGE_ME
max-messages = 3
concatenation = true

# Every SMS to the short code goes to ParkNa. %p is the sender, %a the whole text.
# Same server: 127.0.0.1. Separate SMS gateway: the app server's HeartBeat address, and add the
# gateway's address to sms.mo.allowedIps. ParkNa sends its own replies, so Kannel sends none (max-messages = 0).
group = sms-service
keyword = default
catch-all = true
get-url = "http://127.0.0.1:8080/parkna/api/sms/mo?from=%p&to=%P&text=%a"
max-messages = 0
omit-empty = true
