<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SUNU Park SMS &amp; USSD simulator</title>
<link rel="icon" href="shared/img/crest.png">
<style>
@font-face{font-family:Jakarta;font-weight:500;font-display:swap;src:url(shared/fonts/jakarta-500.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:600;font-display:swap;src:url(shared/fonts/jakarta-600.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:700;font-display:swap;src:url(shared/fonts/jakarta-700.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:800;font-display:swap;src:url(shared/fonts/jakarta-800.woff2) format('woff2')}
:root{--bg:#0B1430;--panel:#121D40;--panel2:#18254F;--line:#26345F;--txt:#E7ECF8;--mute:#8E9AC0;--yellow:#FEDB46;--navy:#0B2E63;--blue:#1A73E8;--ok:#3DDC84;--bad:#FF6B5E;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--droid:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--txt);font-family:Jakarta,system-ui,sans-serif}
body{border-top:3px solid var(--yellow);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.top .mk{width:40px;height:40px;border-radius:11px;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:inset 0 0 0 1.5px #2C4C8C}
.top b{font-size:17px;font-weight:800;display:block;letter-spacing:-.01em}.top small{font-size:12px;color:var(--mute)}
.top .sp{flex:1}
.pill{font:600 12px var(--mono);padding:7px 12px;border-radius:999px;background:var(--panel2);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.pill.y{color:var(--yellow)}.pill.g{color:var(--ok)}.pill.r{color:var(--bad)}
.bench{display:grid;grid-template-columns:auto auto minmax(380px,1fr);gap:28px;padding:22px 28px 40px;align-items:start}
.bench>div:not(.side){position:sticky;top:14px}
@media (max-width:1250px){.bench{grid-template-columns:auto auto}.side{grid-column:1/-1}.bench>div:not(.side){position:static}}
@media (max-width:820px){.bench{grid-template-columns:1fr;padding:16px}.dev{margin:0 auto}}
.ch{font:800 13px Jakarta;letter-spacing:.14em;margin:0 0 12px 6px}.ch em{font:500 12.5px var(--mono);letter-spacing:0;color:var(--mute);font-style:normal;margin-left:8px}
.dev{width:360px;height:720px;border-radius:44px;background:#05070F;padding:11px;box-shadow:0 0 0 2px #2A3560,0 30px 60px -30px #000}
.scr{width:100%;height:100%;border-radius:34px;background:#fff;color:#1F1F1F;overflow:hidden;display:flex;flex-direction:column;position:relative;font-family:var(--droid)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 4px;font-size:13.5px;font-weight:600;color:#111}
.sb i{display:inline-flex;gap:5px;align-items:center}
/* SMS: Android messages */
.mh{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-bottom:1px solid #EEF0F3}
.mh .av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:15px;font-family:Jakarta}
.mh b{font-size:16.5px;font-weight:500;display:block}.mh small{font-size:12.5px;color:#5F6368}
.th{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.dd{align-self:center;font-size:11.5px;color:#5F6368;margin:10px 0 4px}
.row{display:flex;align-items:flex-end;gap:6px}
.row.o{justify-content:flex-end}
.bb{max-width:80%;padding:10px 14px;border-radius:20px;font-size:14.5px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word}
.row.i .bb{background:#EEF0F4;color:#1F1F1F;border-bottom-left-radius:6px}
.row.o .bb{background:#0B57D0;color:#fff;border-bottom-right-radius:6px}
.row .tm{font-size:10.5px;color:#80868B;margin-bottom:3px;white-space:nowrap}
.bb .tg{display:inline-block;font:700 9.5px Jakarta;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--navy);border-radius:5px;padding:1px 6px;margin-bottom:4px}
.typing{align-self:flex-start;background:#EEF0F4;border-radius:18px;padding:12px 14px;display:none;gap:4px}
.typing.on{display:flex}.typing i{width:7px;height:7px;border-radius:50%;background:#9AA0A6;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}
.empty{color:#80868B;font-size:13px;text-align:center;margin:auto 20px}
.qr{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px;scrollbar-width:none}
.qr button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid #C4C7CC;color:#0B57D0;font-size:13.5px;font-weight:500;background:#fff}
.qr button:hover{background:#F1F5FD}
.cmp{display:flex;align-items:center;gap:8px;padding:8px 12px 14px}
.cmp .pl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#444;font-size:22px}
.cmp input{flex:1;min-width:0;height:44px;border-radius:22px;border:0;background:#EEF0F4;padding:0 16px;font-size:15px;font-family:var(--droid);outline:none;color:#1F1F1F}
.cmp .go{width:42px;height:42px;border-radius:50%;background:#C4C7CC;color:#fff;display:grid;place-items:center}
.cmp .go.on{background:#0B57D0}
/* USSD: dialer */
.dial{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 24px 22px}
.dial .num{font-size:34px;color:#202124;min-height:48px;letter-spacing:.02em;font-family:var(--droid);border-bottom:2px solid #E0E3E7;padding:0 6px 4px;max-width:100%;overflow:hidden;white-space:nowrap}
.dial .num.ph{color:#9AA0A6}
.dial .net{font-size:12.5px;color:#5F6368;margin-top:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 30px;margin-top:auto;width:100%}
.pad button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:26px;color:#202124;font-family:var(--droid)}
.pad button:hover{background:#F1F3F4}.pad button small{font-size:10px;letter-spacing:.12em;color:#5F6368;height:12px}
.call{display:flex;align-items:center;justify-content:center;gap:40px;margin-top:10px;width:100%}
.call .c{width:62px;height:62px;border-radius:50%;background:#1E8E3E;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px #1E8E3E}
.call .x{width:40px;height:40px;color:#5F6368;font-size:22px}
.call .sh{width:40px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:22px}
.ov.on{display:flex}
.dlg{background:#fff;border-radius:22px;width:100%;padding:20px 20px 10px;box-shadow:0 20px 50px -16px rgba(0,0,0,.5);font-family:var(--droid)}
.dlg .tx{font-size:15px;line-height:1.45;color:#202124;white-space:pre-wrap;max-height:330px;overflow-y:auto}
.dlg input{width:100%;margin-top:14px;border:0;border-bottom:2px solid #0B57D0;font-size:16px;padding:6px 2px;outline:none;font-family:var(--droid)}
.dlg .bt{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.dlg .bt button{color:#0B57D0;font-weight:600;font-size:14px;letter-spacing:.04em;padding:10px 12px;border-radius:8px;text-transform:uppercase}
.dlg .bt button:hover{background:#F1F5FD}
.dlg .run{display:flex;align-items:center;gap:14px;font-size:15px;color:#202124}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid #D2E3FC;border-top-color:#0B57D0;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* right side panels */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pn>h3{font:800 12.5px Jakarta;letter-spacing:.14em;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pn>h3 span{font:500 12px var(--mono);letter-spacing:0;color:var(--mute)}
.pb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ld{display:flex;gap:10px}
.ld input{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font:500 15px var(--mono);outline:none}
.ld input:focus{border-color:#4A62B0}
.btn{height:46px;padding:0 20px;border-radius:10px;background:#2B3F8C;color:#fff;font-weight:700;font-size:14px}
.btn:hover{background:#3550A8}
.hint{font-size:12.5px;color:var(--mute);line-height:1.5}
.ppl{display:flex;flex-wrap:wrap;gap:8px}
.ppl button{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;font-weight:600}
.ppl button i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.ppl button.o i{background:var(--yellow)}.ppl button.g i{background:#8AB4F8}
.ppl button.on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.who{display:flex;align-items:center;gap:12px;justify-content:space-between}
.who b{font:600 17px var(--mono)}.who small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.badge{font:800 11px Jakarta;letter-spacing:.1em;padding:6px 12px;border-radius:999px;background:#163A2A;color:var(--ok);text-transform:uppercase;white-space:nowrap}
.badge.o{background:#3B3416;color:var(--yellow)}.badge.n{background:var(--panel2);color:var(--mute)}.badge.g{background:#17284D;color:#8AB4F8}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile small{font:600 10.5px Jakarta;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tile b{display:block;font:700 17px var(--mono);margin-top:6px}
.plates{display:flex;flex-direction:column;gap:8px}
.pc{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pc .p{font:700 15px var(--mono);letter-spacing:.06em;background:#fff;color:var(--navy);border-radius:7px;padding:4px 9px}
.pc .s{flex:1;font-size:13px;color:var(--mute);line-height:1.4}.pc .s b{color:var(--txt);font-weight:700}
.st{font:800 10.5px Jakarta;letter-spacing:.08em;padding:4px 9px;border-radius:6px;text-transform:uppercase}
.st.UNPAID{background:#3A1D22;color:var(--bad)}.st.DAILY,.st.MONTHLY{background:#163A2A;color:var(--ok)}.st.ORG{background:#17284D;color:#8AB4F8}.st.W{background:var(--bad);color:#fff}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ctl button:hover{border-color:#4A62B0}.ctl button b{display:block;font-size:14px}.ctl button small{color:var(--mute);font-size:12px}
.ctl button.pri{background:#26398A;border-color:#3550A8}
.lg{display:flex;flex-direction:column}
.lg div{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.lg div:first-child{border-top:0}
.lg code{font:500 12px var(--mono);color:var(--mute)}.lg em{font:600 13px var(--mono);font-style:normal;color:var(--bad)}
.lg small{color:var(--mute);font:500 11.5px var(--mono)}
.sc{display:flex;flex-direction:column}
.sc>div{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:11px 18px;border-top:1px solid var(--line);align-items:center}
.sc code{font:500 12px var(--mono);color:var(--mute)}
.sc b{font-size:13.5px;font-weight:700}.sc small{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.4}
.sc button{font:700 12px Jakarta;padding:7px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.sc button:hover{border-color:var(--yellow)}
.sc .done button{color:var(--ok);border-color:#1F5A3B}
.sc .busy button{color:var(--yellow)}
.off{max-width:620px;margin:80px auto;text-align:center;color:var(--mute);line-height:1.6;padding:20px}
.off b{color:var(--txt);font-size:20px;display:block;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px #000;display:none;z-index:9}
.toast.on{display:block}
</style>
</head>
<body>
<div id="root"><div class="off">Connecting to the SUNU Park server…</div></div>
<div class="toast" id="toast"></div>
<script src="shared/sms.js"></script>
</body>
</html>
