<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SUNU Park SMS simulator</title>
<link rel="icon" href="shared/img/crest.png">
<style>
@font-face{font-family:Jakarta;font-weight:400;font-display:swap;src:url(shared/fonts/jakarta-400.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:600;font-display:swap;src:url(shared/fonts/jakarta-600.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:700;font-display:swap;src:url(shared/fonts/jakarta-700.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:800;font-display:swap;src:url(shared/fonts/jakarta-800.woff2) format('woff2')}
:root{--bg:#F6FBFE;--ink:#0A1B4D;--navy:#0B2E63;--ink2:#4D5A80;--mute:#63709E;--line:#DCE5F0;--fill:#EEF4FA;--yellow:#FEDB46;--blue:#035BF0;--bad:#D93A2B;--ok:#13804B}
*{box-sizing:border-box;margin:0}
body{font-family:Jakarta,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:800;font-size:22px}
header b{font-size:18px;font-weight:800;letter-spacing:-.01em;display:block}
header small{color:var(--mute);font-size:12.5px}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:600;color:var(--ink2)}
.pill.warn{background:#FEF3C2;color:#5A4600}.pill.off{background:#FDE7E4;color:#8A2017}
.link{color:var(--blue);font-weight:600;font-size:13px;text-decoration:none}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px 22px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.side{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 110px);overflow:auto}
.side h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 4px 0}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;width:100%}
.who:hover{background:var(--fill)}
.who .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:var(--fill);color:var(--navy)}
.who .av.o{background:var(--yellow)}.who .av.g{background:var(--navy);color:#fff}
.who span{display:flex;flex-direction:column;min-width:0}.who b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{font-size:11.5px;color:var(--mute)}
.who.on{background:#E3EEFE}
.new{display:flex;gap:6px}.new input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);padding:0 10px}
.btn{height:38px;padding:0 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.btn.y{background:var(--yellow);color:var(--ink)}
.phones{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.empty{color:var(--mute);font-size:14px;padding:40px 10px;text-align:center;flex:1}
.phone{width:330px;max-width:100%;height:640px;background:#0A1B4D;border-radius:38px;padding:12px;display:flex;flex-direction:column;box-shadow:0 20px 40px -24px rgba(10,27,77,.6)}
.scr{flex:1;background:#fff;border-radius:28px;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ph b{font-size:14.5px;display:block}.ph small{font-size:11.5px;color:var(--mute)}
.ph .sp{flex:1}.ph .x{width:30px;height:30px;border-radius:9px;background:var(--fill);font-weight:800}
.role{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--navy)}
.role.o{background:var(--yellow)}.role.g{background:var(--navy);color:#fff}
.th{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#F4F7FB}
.d{align-self:center;font-size:11px;color:var(--mute);font-weight:600;margin:6px 0}
.m{max-width:84%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
.m.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.m.out{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.m small{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.m .tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);background:var(--yellow);border-radius:6px;padding:1px 6px;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.chips button{padding:5px 10px;border-radius:999px;background:var(--fill);font-size:12px;font-weight:700;color:var(--navy)}
.chips button:hover{background:#E3EEFE}
.bar{display:flex;gap:8px;padding:10px}
.bar input{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);padding:0 14px}
.bar button{width:40px;height:40px;border-radius:20px;background:var(--blue);color:#fff;font-weight:800}
.err{color:var(--bad);font-size:12px;padding:0 12px}
.login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:22px;font-weight:800}.login p{color:var(--mute);font-size:14px}
.login input{height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px}
.login .btn{height:44px}
.flows{font-size:12.5px;color:var(--ink2);line-height:1.5;background:var(--fill);border-radius:14px;padding:10px 12px}
.flows b{color:var(--ink)}
</style>
</head>
<body>
<div id="root"><div class="empty">Connecting to the SUNU Park server…</div></div>
<script src="engine.js"></script>
<script src="shared/client.js"></script>
<script src="shared/sms.js"></script>
</body>
</html>
