<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUNU Park terms</title>
<meta name="theme-color" content="#F6FBFE">
<link rel="icon" href="shared/img/crest.png">
<style>
@font-face{font-family:Jakarta;font-weight:400;font-display:swap;src:url(shared/fonts/jakarta-400.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:600;font-display:swap;src:url(shared/fonts/jakarta-600.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:700;font-display:swap;src:url(shared/fonts/jakarta-700.woff2) format('woff2')}
@font-face{font-family:Jakarta;font-weight:800;font-display:swap;src:url(shared/fonts/jakarta-800.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{font-family:Jakarta,system-ui,sans-serif;word-spacing:.07em;color:#0A1B4D;background:#F6FBFE;padding:0 0 48px;line-height:1.6}
.scene{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:22px}
.scene>img{display:block;width:min(900px,100%);height:250px;object-fit:cover;object-position:center 28%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%),linear-gradient(180deg,transparent 0,#000 16%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%),linear-gradient(180deg,transparent 0,#000 16%);mask-composite:intersect}
@media (max-width:600px){.scene>img{height:210px;object-position:center 40%}}
main{position:relative;max-width:760px;margin:-26px auto 0;background:#fff;border:1px solid #E8EEF5;border-radius:26px;padding:28px 24px}
@media (max-width:792px){main{margin:-26px 16px 0}}
a{color:#035BF0;font-weight:600;text-decoration:none}
.top{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#0A1B4D}
.top span{width:58px;height:58px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px -8px rgba(10,27,77,.25)}
.top img{width:46px}
.top small{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#0B2E63;font-weight:700}
.top b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.26em;color:#0A1B4D;text-transform:uppercase}
h1{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.upd{color:#63709E;font-size:14px;margin:6px 0 18px}
h2{font-size:18px;font-weight:800;margin:24px 0 6px;letter-spacing:-.01em}
p,li{font-size:15px;color:#4D5A80}
li b,p b{color:#0A1B4D}
ul{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.box{background:#DFF1FC;border-radius:16px;padding:14px 16px;margin-top:10px}
.tver{display:inline-block;background:#FEF3C2;color:#5A4600;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;margin-left:6px}
#body h3{font-size:18px;font-weight:800;margin:24px 0 6px;letter-spacing:-.01em}
#body p{margin-top:6px}
.note{color:#63709E;font-size:13.5px;margin-top:26px;border-top:1px dashed #DCE5F0;padding-top:14px}
@media print{.scene{display:none}main{border:none;margin:0}}
</style>
</head>
<body>
<div class="scene"><a class="top" href="/"><span><img src="shared/img/crest.png" alt="Banjul City Council crest"></span><div><small>Banjul City Council</small><b>SUNU Park</b></div></a><img src="shared/img/art/banjul-scene-light.svg" alt=""></div>
<main>
<div class="eyebrow">Our park · Our parking</div>
<h1 id="title">Terms and conditions</h1>
<p class="upd" id="upd">Loading the terms in force…</p>
<div id="body"></div>
<p class="note">These are the terms in force. When Banjul City Council changes them, the SUNU Park app asks everyone to read and accept the new version, and an SMS announces it. Also see the <a href="/privacy.html">privacy policy</a>.</p>
</main>
<script src="shared/client.js"></script>
<script>
PN.init({ as: "staff" });
PN.terms().then(function(r){
  if(!r || !r.ok){ document.getElementById("upd").textContent = "The terms could not be loaded. Please try again, or ask at the Council office."; return; }
  var d = r.at ? new Date(r.at) : null;
  document.getElementById("title").textContent = r.title;
  document.title = r.title;
  document.getElementById("upd").innerHTML = "For everyone who parks in a SUNU Park bay or uses the app, the SMS line or the organisation portal. <span class=\"tver\">Version " + r.v + (d && !isNaN(d) ? " · " + d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "") + "</span>";
  document.getElementById("body").innerHTML = PN.termsHtml(r.body);
});
</script>
</body></html>
