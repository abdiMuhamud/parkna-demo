# Weekly dependency updates as pull requests; every PR runs the full build and the browser tests.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      backend-minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories: [/apps/driver, /apps/officer]
    schedule: { interval: weekly, day: monday }
    groups:
      capacitor-minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
