# ParkNa: builds and tests everything on every push.
#   Back end   Maven WAR for Tomcat, tested against the JS engine (parity) and a real MariaDB
#   Front end  the Nginx document root
#   Apps       driver and officer apps for Android
# On main, a GitHub Release gets the server package (parkna-<version>.tar.gz) and both apps.
#
# Google Play (docs/PLAY_STORE.md). Repository settings > Secrets and variables > Actions:
#   variable  PARKNA_SERVER_URL          e.g. https://parkna.gm, built into the apps (https:// makes them HTTPS-only)
#   secrets   ANDROID_KEYSTORE_BASE64    the upload key (base64 of the .jks file)
#             ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
# With the secrets set, each app is built as a signed .aab (upload this to Play) and a signed .apk.
# Without them, a test .apk signed with the shared debug key.
name: Build ParkNa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0"

jobs:
  backend:
    name: Back end, front end and release package
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-pass
          MARIADB_DATABASE: parkna_test
          MARIADB_USER: parkna_test
          MARIADB_PASSWORD: test-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Record runs of the JavaScript engine for the parity tests
        run: node scripts/parity/generate.js backend/target/parity 3 1000

      - name: Build and test the back end (parity + MariaDB round trip)
        working-directory: backend
        run: mvn -B verify -Dparity.dir=target/parity -Dtest.db.url=jdbc:mariadb://127.0.0.1:3306/parkna_test -Dtest.db.password=test-pass

      - name: Package the server release
        run: SKIP_WAR_BUILD=1 scripts/package-release.sh ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: parkna-server
          path: dist/*.tar.gz
          if-no-files-found: error

  apk:
    name: ${{ matrix.label }} app
    runs-on: ubuntu-latest
    env:
      PARKNA_SERVER_URL: ${{ vars.PARKNA_SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: driver
            label: Driver
          - app: officer
            label: Officer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Use the shared debug key (so test builds install over each other)
        run: |
          mkdir -p ~/.android
          cp build/debug.keystore ~/.android/debug.keystore

      - name: Unpack the Google Play upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/parkna-upload.jks"
          echo "PARKNA_KEYSTORE=$RUNNER_TEMP/parkna-upload.jks" >> "$GITHUB_ENV"

      - name: Copy the shared engine and assets into the app
        run: node scripts/build-frontend.js

      - name: Create and prepare the Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          node ../../scripts/prepare-android.js "$APP_VERSION" "${{ github.run_number }}"

      - name: Build
        working-directory: apps/${{ matrix.app }}/android
        env:
          PARKNA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PARKNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PARKNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          N="ParkNa-${{ matrix.label }}-v$APP_VERSION"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/$N.aab"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/$N.apk"
          else
            echo "::notice::No Google Play upload key in the repository secrets: building a test APK only (docs/PLAY_STORE.md)"
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/$N-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ParkNa-${{ matrix.label }}-v${{ env.APP_VERSION }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [backend, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: ParkNa v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          make_latest: "true"
          body: |
            ParkNa v${{ env.APP_VERSION }}, built from ${{ github.sha }}.

            - **parkna-${{ env.APP_VERSION }}.0-b${{ github.run_number }}.tar.gz**: the server package (Tomcat WAR, Nginx front end, config templates, deploy scripts, SQL). Install it with deploy/scripts/deploy.sh; see docs/DEPLOYMENT.md.
            - **ParkNa-Driver-v${{ env.APP_VERSION }}**: the driver app. The `.aab` is for Google Play (docs/PLAY_STORE.md); the `.apk` installs directly on a phone.
            - **ParkNa-Officer-v${{ env.APP_VERSION }}**: the parking attendant app, the same way.

            Files ending in `-test.apk` are test builds (no Play upload key in the repository secrets yet). Apps built without PARKNA_SERVER_URL ask for the server address when first opened.
          files: out/*
