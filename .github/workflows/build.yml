# ParkNa: builds and tests everything on every push.
#   Back end   Maven WAR for Tomcat, tested against the JS engine (parity) and a real MariaDB
#   Front end  the Nginx document root
#   Apps       driver and officer APKs
# On main, a GitHub Release gets the server package (parkna-<version>.tar.gz) and both APKs.
name: Build ParkNa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.2"

jobs:
  backend:
    name: Back end, front end and release package
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-pass
          MARIADB_DATABASE: parkna_test
          MARIADB_USER: parkna_test
          MARIADB_PASSWORD: test-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Record runs of the JavaScript engine for the parity tests
        run: node scripts/parity/generate.js backend/target/parity 3 1000

      - name: Build and test the back end (parity + MariaDB round trip)
        working-directory: backend
        run: mvn -B verify -Dparity.dir=target/parity -Dtest.db.url=jdbc:mariadb://127.0.0.1:3306/parkna_test -Dtest.db.password=test-pass

      - name: Package the server release
        run: SKIP_WAR_BUILD=1 scripts/package-release.sh ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: parkna-server
          path: dist/*.tar.gz
          if-no-files-found: error

  apk:
    name: ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: driver
            label: Driver
          - app: officer
            label: Officer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Use the shared signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp build/debug.keystore ~/.android/debug.keystore

      - name: Copy the shared engine and assets into the app
        run: node scripts/build-frontend.js

      - name: Create and prepare the Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node ../../scripts/prepare-android.js "$APP_VERSION" "${{ github.run_number }}"
          npx cap sync android

      - name: Build the APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/ParkNa-${{ matrix.label }}-v$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ParkNa-${{ matrix.label }}-v${{ env.APP_VERSION }}
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [backend, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: ParkNa v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          make_latest: "true"
          body: |
            ParkNa v${{ env.APP_VERSION }}, built from ${{ github.sha }}.

            - **parkna-${{ env.APP_VERSION }}.0-b${{ github.run_number }}.tar.gz**: the server package (Tomcat WAR, Nginx front end, config templates, deploy scripts, SQL). Install it with deploy/scripts/deploy.sh; see docs/DEPLOYMENT.md.
            - **ParkNa-Driver-v${{ env.APP_VERSION }}.apk**: the driver app
            - **ParkNa-Officer-v${{ env.APP_VERSION }}.apk**: the parking attendant line

            Open an app and enter the server address, e.g. https://parkna.example.gm.
          files: out/*
